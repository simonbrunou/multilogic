name: ci

# Merge gate complementing fallow.yml (which audits changed-file quality). This runs the
# type-check, lint, unit tests + coverage, build, browser-component tests, and e2e smoke.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check · lint · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bun.lock is the only lockfile
        # Renovate moves package.json to its npm manager, and stops updating bun.lock, once
        # another JS lockfile exists (#89). .npmrc stops npm from writing one, not yarn or pnpm.
        run: |
          stray=$(git ls-files '*package-lock.json' '*npm-shrinkwrap.json' '*yarn.lock' '*pnpm-lock.yaml')
          if [ -n "$stray" ]; then
            echo "bun.lock must be the only lockfile (#89). Remove: $stray" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run prepare # svelte-kit sync — generates $lib aliases + tsconfig
      - name: Type-check (svelte-check)
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Unit tests + coverage
        run: bun run test:coverage
      - name: Build (static SPA)
        run: bun run pregen && bun run build

  browser-e2e:
    name: component + e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run prepare
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Component tests (Vitest browser mode)
        run: bun run test:browser
      - name: E2E (Playwright)
        run: bun run test:e2e
